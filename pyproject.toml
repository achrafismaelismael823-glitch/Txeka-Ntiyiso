[tool.poetry]
name = "docverify-mz"
version = "0.1.0"
description = "Plataforma de custódia e validação de documentos para Moçambique"
authors = ["DocVerify Team <agy@docverify.mz>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/achrafismaelismaeli823-glitch/DocVerify-MZ"
keywords = ["moçambique", "documentos", "criptografia", "segurança", "ocr"]

# Dependências compartilhadas entre workspaces
[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = "^1.0.0"

# Dev dependencies compartilhadas
[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
bandit = "^1.7.5"
safety = "^2.3.0"

# Workspaces (monorepo structure)
[tool.poetry.packages]
{ include = "docverify_mz", from = "." }

[tool.poetry-monorepo]
packages = [
    { path = "api-gateway" },
    { path = "core" },
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "api-gateway/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["core/src", "api-gateway/src"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
