[tool.poetry]
name = "txeka-ntiyiso"
version = "0.1.0"
description = "Plataforma de custódia e validação de documentos para Moçambique"
authors = ["Txeka Ntiyiso Team <admin@txekantiyiso.mz>"]
license = "Proprietary" 
readme = "README.md"
repository = "https://github.com/achrafismaelismaeli823-glitch/Txeka-Ntiyiso"
keywords = ["moçambique", "documentos", "criptografia", "segurança", "ocr", "txeka ntiyiso"]

# Dependências essenciais para o Render e projeto
[tool.poetry.dependencies]
python = "^3.11" 
python-dotenv = "^1.0.0"
fastapi = "^0.100.0"
uvicorn = "^0.23.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0" 

# Dev dependencies compartilhadas
[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"
isort = "^5.12.0"
bandit = "^1.7.5"
safety = "^2.3.0"


[[tool.poetry.packages]]
include = "src"
from = "api-gateway"

[tool.poetry-monorepo]
packages = [
    { path = "api-gateway" },
    { path = "core" },
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["core/tests", "api-gateway/tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
