version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docverify-api
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: INFO
    volumes:
      - .:/app
    command: >
      sh -c "poetry install &&
             uvicorn api-gateway.src.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - docverify-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  docverify-network:
    driver: bridge

volumes:
  docverify-data:
    driver: local
