<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>DocVerify MZ - Validador Real</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 60px auto; text-align: center; background: #f4f6f9; color: #333; }
        .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        button { background: #0070f3; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0051cb; }
        .status-msg { margin-top: 25px; padding: 15px; border-radius: 6px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>DocVerify MZ 🇲🇿</h2>
        <p>Validador de Integridade e Autenticidade de Documentos Governamentais</p>
        
        <div style="margin: 30px 0;">
            <input type="file" id="fileInput" style="font-size: 14px;">
        </div>
        
        <button onclick="processarEVerificar()">Verificar Documento Original</button>
        
        <div id="resultado" class="status-msg"></div>
    </div>

    <script>
        // Função Criptográfica Nativa: Calcula o SHA-256 real do ficheiro no browser
        async function calcularSHA256(file) {
            const arrayBuffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function processarEVerificar() {
            const fileInput = document.getElementById('fileInput');
            const resultado = document.getElementById('resultado');
            const file = fileInput.files;

            if (!file) {
                resultado.style.display = "block";
                resultado.style.background = "#ffebee";
                resultado.style.color = "#c62828";
                resultado.innerHTML = "❌ Erro: Selecione um ficheiro PDF ou imagem primeiro.";
                return;
            }

            resultado.style.display = "block";
            resultado.style.background = "#e3f2fd";
            resultado.style.color = "#1565c0";
            resultado.innerHTML = "⏳ A ler ficheiro e a gerar assinatura criptográfica SHA-256...";

            try {
                // 1. Calcula o Hash Real do ficheiro que o utilizador escolheu
                const hashReal = await calcularSHA256(file);
                console.log("Hash Gerado:", hashReal);

                // 2. Faz o pedido HTTP real à nossa API Gateway em Python
                const response = await fetch('http://127.0.0.1:8000/api/v1/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        doc_hash: hashReal,
                        institution_id: "INAGE_PORTAL_VALIDACAO"
                    })
                });

                const dados = await response.json();

                if (response.ok) {
                    resultado.style.background = "#e8f5e9";
                    resultado.style.color = "#2e7d32";
                    resultado.innerHTML = `✅ AUTÊNTICO: Documento Identificado!<br><small>ID: ${dados.dados_publicos.doc_id} | Estado: ${dados.dados_publicos.estado}</small>`;
                } else {
                    resultado.style.background = "#ffebee";
                    resultado.style.color = "#c62828";
                    resultado.innerHTML = dados.detail || "❌ Documento não reconhecido.";
                }

            } catch (error) {
                resultado.style.background = "#fff3e0";
                resultado.style.color = "#ef6c00";
                resultado.innerHTML = "📡 Erro de Conexão: Certifique-se que o servidor FastAPI está a rodar em localhost:8000.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
