[tool.poetry]
name = "txeka-api"
version = "2.0.0"
description = "Txeka Ntiyiso - Plataforma de Validação Digital de Documentos para Moçambique"
authors = ["Ntiyiso <ntiyiso@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Framework & Servidor
fastapi = "0.110.0"
uvicorn = { version = "0.28.0", extras = ["standard"] }
starlette = "0.36.3"

# Configuração & Validação
pydantic = "2.10.3"
pydantic-settings = "2.2.1"
python-dotenv = "1.0.1"
python-multipart = "0.0.9"
email-validator = "2.3.0"

# Banco de Dados & ORM
sqlalchemy = "2.0.29"
alembic = "1.12.1"
psycopg2-binary = "2.9.9"
asyncpg = "0.29.0"

# Segurança & Autenticação
bcrypt = "5.0.0"
python-jose = "3.5.0"
pyjwt = "2.8.0"
cryptography = "42.0.5"

# Observabilidade & Rate Limiting
structlog = "24.1.0"
slowapi = "0.1.9"
limits = "3.8.0"

# Processamento de Arquivos & I/O
pypdf2 = "3.0.1"
aiofiles = "23.2.1"
requests = "2.31.0"

# Geração de QR Code
qrcode = { version = "7.4.2", extras = ["pil"] }
pillow = "11.0.0"

# Dependência Local do Monorepo
txeka-core = { path = "../core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.12"
httpx = "^0.27"
bandit = "^1.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
