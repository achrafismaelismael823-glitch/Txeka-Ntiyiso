[tool.poetry]
name = "docverify-api-gateway"
version = "0.1.0"
description = "API Gateway - FastAPI para DocVerify MZ"
authors = ["DocVerify Team <agy@docverify.mz>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.104.1"
uvicorn = { version = "^0.24.0", extras = ["standard"] }
pydantic = "^2.5.2"
pydantic-settings = "^2.0.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
cryptography = "^41.0.0"
requests = "^2.31.0"
aiofiles = "^23.2.1"
docverify-core = { path = "../core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
httpx = "^0.24.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[tool.poetry.scripts]
docverify-api = "src.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
