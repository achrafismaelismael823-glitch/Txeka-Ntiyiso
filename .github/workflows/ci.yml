name: Txeka Ntiyiso CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx bandit
          pip install -r requirements.txt
      - name: Executar testes
        run: pytest tests/ -v
      - name: Scan de segurança (bandit)
        run: bandit -r src/ -ll -ii
