name: Txeka Ntiyiso CI/CD — Pipeline v2.0

on:
  push:
    branches: [main, "fix/**", "feat/**", "hotfix/**"]
  pull_request:
    branches: [main]

env:
  # Variáveis mínimas para a aplicação subir sem erro
  SECRET_KEY: test-secret-key-32-chars-long!!!
  JWT_SECRET_KEY: test-jwt-secret-key-32-chars-long!!!
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: 30
  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/txeka_test
  SENTRY_DSN: ""
  ENVIRONMENT: test

jobs:
  # ═══════════════════════════════════════════════════════════════
  # GATE 0: IMPORT TEST — Proteção contra circular import
  # Este gate replica EXATAMENTE o startup do Render.
  # O erro da semana passada (01/09) NÃO passaria aqui.
  # ═══════════════════════════════════════════════════════════════
  gate-0-import:
    name: "🔴 Gate 0: Import / Startup Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: "🔴 GATE 0: python -c 'from src.main import app'"
        run: |
          echo "=== GATE 0: Simulando startup do Render ==="
          echo "Este teste carrega TODOS os módulos na mesma ordem do Uvicorn."
          echo "Se houver import circular, quebra AQUI — não na produção."
          python -c "from src.main import app"
          echo "✅ GATE 0 PASSOU — nenhum import circular detectado"
      - name: "🔴 GATE 0b: Verificar endpoints críticos existem"
        run: |
          python -c "
          from src.main import app
          routes = [r.path for r in app.routes]
          assert '/health' in routes, 'FATAL: /health removido — readiness probe quebrado'
          assert '/ready' in routes, 'FATAL: /ready removido — Render pode matar instâncias'
          print('✅ Endpoints críticos presentes: /health, /ready')
          "

  # ═══════════════════════════════════════════════════════════════
  # GATE 1: LINT + TYPE CHECK — Qualidade de código
  # ═══════════════════════════════════════════════════════════════
  gate-1-lint:
    name: "🟡 Gate 1: Lint & Type Check"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt
      - name: "🟡 Ruff Lint"
        run: ruff check src/ --output-format=github || true
      - name: "🟡 MyPy Type Check"
        run: mypy src/ --ignore-missing-imports --no-error-summary || true
      - name: "🟡 py_compile (syntax check universal)"
        run: |
          find src/ -name "*.py" -exec python -m py_compile {} \;
          echo "✅ Syntax OK em todos os .py"

  # ═══════════════════════════════════════════════════════════════
  # GATE 2: UNIT TESTS — Lógica de negócio
  # ═══════════════════════════════════════════════════════════════
  gate-2-tests:
    name: "🟢 Gate 2: Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: txeka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
          pip install -r requirements.txt
      - name: Aguardar PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Aguardando PostgreSQL..."; sleep 1;
          done
      - name: "🟢 pytest"
        run: pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════
  # GATE 3: SECURITY SCAN — Bandit
  # ═══════════════════════════════════════════════════════════════
  gate-3-security:
    name: "🔵 Gate 3: Security Scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install bandit
      - name: "🔵 Bandit Scan"
        run: bandit -r src/ -ll -ii -f json -o bandit-report.json || true
      - name: "🔵 Bandit Report"
        run: |
          if [ -f bandit-report.json ]; then
            echo "Bandit report gerado. Verificar artifacts."
            cat bandit-report.json | python -m json.tool || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: api-gateway/bandit-report.json

  # ═══════════════════════════════════════════════════════════════
  # GATE 4: DOCKER BUILD — Replicar ambiente Render
  # ═══════════════════════════════════════════════════════════════
  gate-4-docker:
    name: "🟣 Gate 4: Docker Build & Health Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "🟣 Docker Build"
        run: docker build -t txeka-ntiyiso:test .
      - name: "🟣 Docker Run + Health Check"
        run: |
          # Sobe o container em background com env mínimo
          docker run -d             --name txeka-test             -e SECRET_KEY=test-secret-key-32-chars-long!!!             -e JWT_SECRET_KEY=test-jwt-secret-key-32-chars-long!!!             -e ALGORITHM=HS256             -e ACCESS_TOKEN_EXPIRE_MINUTES=30             -e DATABASE_URL=sqlite+aiosqlite:///./test.db             -e ENVIRONMENT=test             -e SENTRY_DSN=""             -p 8000:8000             txeka-ntiyiso:test

          echo "Aguardando startup (40s max)..."
          for i in {1..40}; do
            sleep 1
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ GATE 4 PASSOU — Container subiu e /health responde 200"
              docker stop txeka-test && docker rm txeka-test
              exit 0
            fi
            echo "Tentativa $i/40..."
          done

          echo "❌ GATE 4 FALHOU — Container não subiu ou /health não responde"
          docker logs txeka-test
          docker stop txeka-test && docker rm txeka-test
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # GATE 5: DEPLOY STAGING (só na main)
  # ═══════════════════════════════════════════════════════════════
  deploy-staging:
    name: "🚀 Deploy Staging"
    runs-on: ubuntu-latest
    needs: [gate-0-import, gate-1-lint, gate-2-tests, gate-3-security, gate-4-docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "🚀 Deploy para Render Staging"
        run: |
          echo "Staging deploy placeholder"
          echo "Integrar com Render deploy hook quando staging estiver configurado"
