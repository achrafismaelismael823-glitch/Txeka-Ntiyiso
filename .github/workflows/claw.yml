name: Txeka Claw Bot v4.1 - Senior
on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, closed, merged]

jobs:
  claw-senior:
    if: contains(github.event.issue.body, '@claw') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar Claw Senior
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLAW_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            if (context.payload.pull_request) {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              let msg = `🦀 **Claw Senior Audit** | PR #${pr.number}\n\n`;
              if (action === 'opened') {
                msg += `**PR Aberto:** ${pr.title}\n`;
                msg += `📊 **Stats:** +${pr.additions} -${pr.deletions} | ${pr.changed_files} arquivos\n`;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: msg
              });
              return;
            }

            const body = context.payload.issue.body;
            const issueNumber = context.payload.issue.number;

            // @claw estrutura [path]
            if (body.includes('@claw estrutura')) {
              const args = body.split('@claw estrutura')[1].trim();
              const targetPath = args || '.';
              let msg = `🦀 **Claw Senior v4.1** | @${context.payload.issue.user.login}\n\n`;
              msg += `**Estrutura: ${targetPath}**\n\n`;

              try {
                const files = fs.readdirSync(targetPath);
                files.forEach(file => {
                  const filePath = path.join(targetPath, file);
                  const stats = fs.statSync(filePath);
                  const icon = stats.isDirectory()? '📁' : '📄';
                  msg += `${icon} ${file}\n`;
                });
              } catch (e) {
                msg += `❌ Erro: Pasta não encontrada \`${targetPath}\``;
              }

              msg += `\n---\n*Issue #${issueNumber} | sucesso*`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: msg
              });
            }
