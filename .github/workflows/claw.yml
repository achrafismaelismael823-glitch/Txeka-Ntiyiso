name: Txeka Claw Bot v4.5 - Ultra Senior
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created] 
  pull_request:
    types: [opened, closed, merged]

jobs:
  claw-senior:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claw')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claw'))
    runs-on: ubuntu-latest
    permissions:
      issues: write        
      pull-requests: write 
      contents: read       
      actions: read        

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Executar Claw Senior
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // --- FLUXO DE PULL REQUESTS ---
            if (context.payload.pull_request) {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              let msg = `🦀 **Claw Senior Audit** | PR #${pr.number}\n\n`;
              if (action === 'opened') {
                msg += `**PR Aberto:** ${pr.title}\n`;
                msg += `📊 **Stats:** +${pr.additions} -${pr.deletions} | ${pr.changed_files} arquivos\n`;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: msg
              });
              return;
            }

            // --- FLUXO DE COMANDOS NAS ISSUES ---
            const body = context.payload.comment ? context.payload.comment.body : context.payload.issue.body;
            const issueNumber = context.payload.issue.number;
            const userLogin = context.payload.comment ? context.payload.comment.user.login : context.payload.issue.user.login;
            
            let finalMsg = `🦀 **Txeka Claw Bot v4.5** | @${userLogin}\n\n`;
            let executouComando = false;

            function rodarComando(cmd) {
              try { return execSync(cmd, { encoding: 'utf8' }).trim(); }
              catch (e) { return `❌ Erro na execução interna: ${e.message}`; }
            }

            // Comando original estruturado com replace seguro
            if (body.includes('@claw estrutura')) {
              executouComando = true;
              const targetPath = body.replace('@claw estrutura', '').trim() || '.';
              finalMsg += `**Estrutura: ${targetPath}**\n\n`;
              try {
                const files = fs.readdirSync(targetPath);
                files.forEach(file => {
                  const stats = fs.statSync(path.join(targetPath, file));
                  finalMsg += `${stats.isDirectory() ? '📁' : '📄'} ${file}\n`;
                });
              } catch (e) { finalMsg += `❌ Erro: Pasta não encontrada \`${targetPath}\``; }
            }

            // 1. @claw ver
            if (body.includes('@claw ver ')) {
              executouComando = true;
              const target = body.replace('@claw ver ', '').trim();
              try {
                if (target && fs.existsSync(target) && fs.statSync(target).isFile()) {
                  const content = fs.readFileSync(target, 'utf8');
                  finalMsg += `**Conteúdo de \`${target}\`:**\n\`\`\`\n${content.slice(0, 4000)}\n\`\`\``;
                } else { finalMsg += `❌ Arquivo inválido ou não encontrado: \`${target}\``; }
              } catch(e) { finalMsg += `❌ Erro: ${e.message}`; }
            }

            // 2. @claw busca
            if (body.includes('@claw busca ')) {
              executouComando = true;
              const termo = body.replace('@claw busca ', '').trim().replace(/['"]/g, '');
              if (termo) {
                finalMsg += `🔍 **Resultado da busca por: "${termo}"**\n\n`;
                const res = rodarComando(`git grep -n "${termo}" || echo "Nenhuma ocorrência encontrada."`);
                finalMsg += `\`\`\`\n${res.slice(0, 3000)}\n\`\`\``;
              }
            }

            // 3. @claw diff
            if (body.includes('@claw diff')) {
              executouComando = true;
              finalMsg += `📉 **Diff comparado com a branch padrão:**\n\n`;
              const res = rodarComando(`git diff origin/${context.payload.repository.default_branch} --stat || echo "Sem diferenças."`);
              finalMsg += `\`\`\`\n${res}\n\`\`\``;
            }

            // 4. @claw tamanho
            if (body.includes('@claw tamanho ')) {
              executouComando = true;
              const target = body.replace('@claw tamanho ', '').trim();
              finalMsg += `⚖️ **Análise de tamanho de: \`${target}\`**\n\n`;
              if (target && fs.existsSync(target)) {
                const linhas = rodarComando(`find ${target} -type f -exec wc -l {} + | tail -n 1`);
                const espaco = rodarComando(`du -sh ${target}`);
                finalMsg += `* **Espaço em disco:** \`${espaco}\`\n* **Contagem de linhas:** \`${linhas}\``;
              } else { finalMsg += `❌ Caminho inválido ou não encontrado.`; }
            }

            // 5. @claw status ci
            if (body.includes('@claw status ci')) {
              executouComando = true;
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, per_page: 10 });
                const ciRun = runs.data.workflow_runs.find(r => r.name.includes('Txeka Ntiyiso'));
                if (ciRun) {
                  finalMsg += `📊 **Status do Pipeline (${ciRun.name}):** ${ciRun.conclusion === 'success' ? '✅ SUCESSO' : '❌ FALHA'}\n`;
                  finalMsg += `* **Logs:** [Link para a execução](${ciRun.html_url})`;
                } else { finalMsg += `⚠️ Pipeline "Txeka Ntiyiso" não localizado no histórico recente.`; }
              } catch(e) { finalMsg += `❌ Erro ao ler Actions: ${e.message}`; }
            }

            // 6. @claw logs
            if (body.includes('@claw logs')) {
              executouComando = true;
              finalMsg += `📋 **Status Git de Telemetria:**\n\n`;
              const res = rodarComando(`git log -n 3 --oneline`);
              finalMsg += `\`\`\`\n${res}\n\`\`\``;
            }

            // 7. @claw historico
            if (body.includes('@claw historico')) {
              executouComando = true;
              finalMsg += `⏳ **Histórico Recente de Execuções:**\n\n`;
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo.repo, per_page: 5 });
                runs.data.workflow_runs.forEach(r => {
                  finalMsg += `* [${r.conclusion === 'success' ? '✅' : '❌'}] **${r.name}** - #${r.run_number} ([Logs](${r.html_url}))\n`;
                });
              } catch(e) { finalMsg += `❌ Erro: ${e.message}`; }
            }

            // 8. @claw ambiente
            if (body.includes('@claw ambiente')) {
              executouComando = true;
              finalMsg += `💻 **Especificações do Ambiente do Runner:**\n\n`;
              const pyVer = rodarComando(`python3 --version || echo "Não instalado"`);
              const nodeVer = process.version;
              const dockerVer = rodarComando(`docker --version || echo "Não instalado"`);
              finalMsg += `* **Python:** \`${pyVer}\`\n* **Node.js:** \`${nodeVer}\`\n* **Docker:** \`${dockerVer}\``;
            }

            // 9. @claw commits
            if (body.includes('@claw commits')) {
              executouComando = true;
              const valorTxt = body.replace('@claw commits', '').trim();
              const qtd = parseInt(valorTxt) || 5;
              finalMsg += `📜 **Últimos ${qtd} Commits na Branch:**\n\n`;
              const res = rodarComando(`git log -n ${qtd} --pretty=format:"* %h - %an: %s (%cr)"`);
              finalMsg += res;
            }

            // 10. @claw autores
            if (body.includes('@claw autores')) {
              executouComando = true;
              finalMsg += `👥 **Contribuintes do Repositório (Ranking):**\n\n`;
              const res = rodarComando(`git shortlog -sn --all`);
              finalMsg += `\`\`\`\n${res}\n\`\`\``;
            }

            // 11. @claw branches
            if (body.includes('@claw branches')) {
              executouComando = true;
              finalMsg += `🌿 **Branches Ativas Rastreadas:**\n\n`;
              const res = rodarComando(`git branch -r | grep -v HEAD`);
              finalMsg += `\`\`\`\n${res}\n\`\`\``;
            }

            // 12. @claw tags
            if (body.includes('@claw tags')) {
              executouComando = true;
              finalMsg += `🏷️ **Últimas Tags do Git:**\n\n`;
              const res = rodarComando(`git tag -l | tail -n 5 || echo "Nenhuma tag criada."`);
              finalMsg += `\`\`\`\n${res}\n\`\`\``;
            }

            // 14. @claw dependencias
            if (body.includes('@claw dependencias')) {
              executouComando = true;
              finalMsg += `📦 **Arquivos de Dependências Localizados:**\n\n`;
              const reqExist = fs.existsSync('api-gateway/requirements.txt') || fs.existsSync('requirements.txt');
              finalMsg += `* **Python (requirements.txt):** ${reqExist ? '✅ Localizado' : '❌ Não encontrado'}\n`;
            }

            // 15. @claw todo
            if (body.includes('@claw todo')) {
              executouComando = true;
              finalMsg += `📝 **Pendências Técnicas Encontradas (TODO/FIXME):**\n\n`;

