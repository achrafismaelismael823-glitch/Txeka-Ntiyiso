name: Txeka Claw Bot v4.5 - Ultra Senior
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, merged]

jobs:
  claw-senior:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claw')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claw'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Claw Senior
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            // --- FLUXO DE PULL REQUESTS ---
            if (context.payload.pull_request) {
              const pr = context.payload.pull_request;
              const action = context.payload.action;
              let msg = `🦀 **Claw Senior Audit** | PR #${pr.number}\n\n`;
              if (action === 'opened') {
                msg += `**PR Aberto:** ${pr.title}\n`;
                msg += `📊 **Stats:** +${pr.additions} -${pr.deletions} | ${pr.changed_files} arquivos\n`;
              } else if (action === 'closed') {
                msg += `**PR Fechado:** ${pr.title}\n`;
                msg += `Status: ${pr.merged? '✅ MERGED' : '❌ CLOSED'}`;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: msg
              });
              return;
            }

            // --- TRATAMENTO SEGURO ---
            let body = "";
            let userLogin = "";

            if (context.payload.comment) {
              body = context.payload.comment.body || "";
              userLogin = context.payload.comment.user?.login || "";
            } else if (context.payload.issue) {
              body = context.payload.issue.body || "";
              userLogin = context.payload.issue.user?.login || "";
            }

            const issueNumber = context.payload.issue?.number;
            let finalMsg = `🦀 **Txeka Claw Bot v4.5** | @${userLogin}\n\n`;
            let executouComando = false;

            function rodarComando(cmd) {
              try { return execSync(cmd, { encoding: 'utf8' }).trim(); }
              catch (e) { return `❌ Erro: ${e.message}`; }
            }

            // 1. @claw estrutura
            if (body.includes('@claw estrutura')) {
              executouComando = true;
              const targetPath = body.replace('@claw estrutura', '').trim() || '.';
              finalMsg += `**Estrutura: ${targetPath}**\n\n`;
              try {
                const files = fs.readdirSync(targetPath);
                files.forEach(file => {
                  const stats = fs.statSync(path.join(targetPath, file));
                  finalMsg += `${stats.isDirectory()? '📁' : '📄'} ${file}\n`;
                });
              } catch (e) { finalMsg += `❌ Erro: Pasta não encontrada \`${targetPath}\``; }
            }

            // 2. @claw ver
            if (body.includes('@claw ver ')) {
              executouComando = true;
              const target = body.replace('@claw ver ', '').trim();
              try {
                if (target && fs.existsSync(target) && fs.statSync(target).isFile()) {
                  const content = fs.readFileSync(target, 'utf8');
                  finalMsg += `**Conteúdo de \`${target}\`:**\n\`\`\n${content.slice(0, 4000)}\n\`\``;
                } else { finalMsg += `❌ Arquivo inválido: \`${target}\``; }
              } catch(e) { finalMsg += `❌ Erro: ${e.message}`; }
            }

            // 3. @claw busca
            if (body.includes('@claw busca ')) {
              executouComando = true;
              const termo = body.replace('@claw busca ', '').trim().replace(/['"]/g, '');
              if (termo) {
                finalMsg += `🔍 **Busca por: "${termo}"**\n\n`;
                const res = rodarComando(`git grep -n "${termo}" || echo "Nenhuma ocorrência."`);
                finalMsg += `\`\n${res.slice(0, 3000)}\n\`\``;
              }
            }

            // 4. @claw diff
            if (body.includes('@claw diff')) {
              executouComando = true;
              finalMsg += `📉 **Diff vs branch padrão:**\n\n`;
              const res = rodarComando(`git diff origin/${context.payload.repository.default_branch} --stat || echo "Sem diferenças."`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 5. @claw tamanho
            if (body.includes('@claw tamanho ')) {
              executouComando = true;
              const target = body.replace('@claw tamanho ', '').trim();
              finalMsg += `⚖️ **Tamanho de: \`${target}\`**\n\n`;
              if (target && fs.existsSync(target)) {
                const linhas = rodarComando(`find ${target} -type f -exec wc -l {} + | tail -n 1`);
                const espaco = rodarComando(`du -sh ${target}`);
                finalMsg += `* **Espaço:** \`${espaco}\`\n* **Linhas:** \`${linhas}\``;
              } else { finalMsg += `❌ Caminho inválido.`; }
            }

            // 6. @claw status ci
            if (body.includes('@claw status ci')) {
              executouComando = true;
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 30
                });
                const ciRun = runs.data.workflow_runs.find(r => r.name.toLowerCase().includes('txeka'));
                if (ciRun) {
                  finalMsg += `📊 **Pipeline (${ciRun.name}):** ${ciRun.conclusion === 'success'? '✅ SUCESSO' : '❌ FALHA'}\n`;
                  finalMsg += `* **Logs:** [Ver execução](${ciRun.html_url})`;
                } else { finalMsg += `⚠️ Nenhum histórico do pipeline localizado.`; }
              } catch(e) { finalMsg += `❌ Erro: ${e.message}`; }
            }

            // 7. @claw logs
            if (body.includes('@claw logs')) {
              executouComando = true;
              finalMsg += `📋 **Últimos 3 commits:**\n\n`;
              const res = rodarComando(`git log -n 3 --oneline`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 8. @claw historico
            if (body.includes('@claw historico')) {
              executouComando = true;
              finalMsg += `⏳ **Últimas 5 execuções:**\n\n`;
              try {
                const runs = await github.rest.actions.listWorkflowRunsForRepo({ owner: context.repo.owner, repo: context.repo, per_page: 5 });
                runs.data.workflow_runs.forEach(r => {
                  finalMsg += `* [${r.conclusion === 'success'? '✅' : '❌'}] **${r.name}** - #${r.run_number}\n`;
                });
              } catch(e) { finalMsg += `❌ Erro: ${e.message}`; }
            }

            // 9. @claw ambiente
            if (body.includes('@claw ambiente')) {
              executouComando = true;
              finalMsg += `💻 **Ambiente Runner:**\n\n`;
              const pyVer = rodarComando(`python3 --version || echo "Não instalado"`);
              const nodeVer = process.version;
              const dockerVer = rodarComando(`docker --version || echo "Não instalado"`);
              finalMsg += `* **Python:** \`${pyVer}\`\n* **Node.js:** \`${nodeVer}\`\n* **Docker:** \`${dockerVer}\``;
            }

            // 10. @claw commits
            if (body.includes('@claw commits')) {
              executouComando = true;
              const valorTxt = body.replace('@claw commits', '').trim();
              const qtd = parseInt(valorTxt) || 5;
              finalMsg += `📜 **Últimos ${qtd} commits:**\n\n`;
              const res = rodarComando(`git log -n ${qtd} --pretty=format:"* %h - %an: %s (%cr)"`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 11. @claw autores
            if (body.includes('@claw autores')) {
              executouComando = true;
              finalMsg += `👥 **Ranking de contribuintes:**\n\n`;
              const res = rodarComando(`git shortlog -sn --all`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 12. @claw branches
            if (body.includes('@claw branches')) {
              executouComando = true;
              finalMsg += `🌿 **Branches remotas:**\n\n`;
              const res = rodarComando(`git branch -r | grep -v HEAD`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 13. @claw tags
            if (body.includes('@claw tags')) {
              executouComando = true;
              finalMsg += `🏷️ **Últimas tags:**\n\n`;
              const res = rodarComando(`git tag -l | tail -n 5 || echo "Nenhuma tag."`);
              finalMsg += `\`\n${res}\n\`\``;
            }

            // 14. @claw dependencias
            if (body.includes('@claw dependencias')) {
              executouComando = true;
              finalMsg += `📦 **Dependências:**\n\n`;
              const reqExist = fs.existsSync('api-gateway/requirements.txt') || fs.existsSync('requirements.txt');
              finalMsg += `* **Python requirements.txt:** ${reqExist? '✅' : '❌'}\n`;
            }

            // 15. @claw todo
            if (body.includes('@claw todo')) {
              executouComando = true;
              finalMsg += `📝 **TODOs no código:**\n\n`;
              const res = rodarComando(`git grep -i "TODO" || echo "Nenhum TODO encontrado."`);
              finalMsg += `\`\n${res.slice(0, 3000)}\n\`\``;
            }

            // AJUDA
            if (!executouComando) {
              finalMsg += `**15 Comandos disponíveis:**\n`;
              finalMsg += `1. estrutura 2. ver 3. busca 4. diff 5. tamanho 6. status ci\n`;
              finalMsg += `7. logs 8. historico 9. ambiente 10. commits 11. autores\n`;
              finalMsg += `12. branches 13. tags 14. dependencias 15. todo\n\n`;
              finalMsg += `Ex: \`@claw busca hash\``;
            }

            // ENVIAR RESPOSTA
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo,
                issue_number: issueNumber,
                body: finalMsg
              });
            }
