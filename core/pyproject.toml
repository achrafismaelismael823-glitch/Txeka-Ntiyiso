[tool.poetry]
name = "docverify-core"
version = "0.1.0"
description = "Core Module - Motor criptográfico e segurança"
authors = ["DocVerify Team <agy@docverify.mz>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
pillow = "^10.0.0"
qrcode = "^7.4.2"
cryptography = "^41.0.0"
pydantic = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
