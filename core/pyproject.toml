[tool.poetry]
name = "txeka-core"  
version = "0.1.0"
description = "Core Module - Motor criptográfico e segurança - Txeka Ntiyiso"
authors = ["Txeka Team <dev@txeka.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"  

pillow = "^11.0.0"
qrcode = "^7.4.2"
cryptography = "^42.0.5"
pydantic = "^2.5.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
